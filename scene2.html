<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scene 2 — We were here</title>

<style>
  :root{
    --bg: #05060a;
    --text: rgba(255,255,255,0.92);
    --muted: rgba(255,255,255,0.7);

    --heart: rgba(255,105,180,0.95);
    --line: rgba(255,190,225,0.85);

    --glow: 0 0 18px rgba(255,160,200,0.22);

    --btn-bg: rgba(255,255,255,0.18);
    --btn-bg-hover: rgba(255,255,255,0.28);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:var(--bg);
    font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color:var(--text);
  }

  .scene{
    display:flex;
    height:100vh;
    width:100vw;
  }

  /* LEFT PANEL */
  .left{
    width:50%;
    background:black;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px;
  }

  .text{
    max-width:500px;
    text-shadow:var(--glow);
  }

  .line{
    opacity:0;
    transform:translateY(6px);
    transition:opacity 1s ease, transform 1s ease;
    font-weight:300;
    font-size:clamp(22px,2.5vw,32px);
    margin:16px 0;
  }

  .line.show{
    opacity:1;
    transform:translateY(0);
  }

  .continue{
    margin-top:30px;
    padding:10px 18px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    background:var(--btn-bg);
    color:white;
    font-size:14px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .8s ease, transform .8s ease, background .2s ease;
  }

  .continue.show{
    opacity:1;
    transform:translateY(0);
  }

  .continue:hover{
    background:var(--btn-bg-hover);
  }

  /* RIGHT MAP SIDE */
  .right{
    width:50%;
    position:relative;
    overflow:hidden;
    background:black;
  }

  .map-image{
    position:absolute;
    top:0;
    right:0;                 /* anchor to right */
    height:100%;
    width:auto;              /* keeps aspect ratio */
    object-fit:cover;
  }

  /* ROUTES */
  .lines{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  .route{
    fill:none;
    stroke:var(--line);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-dasharray:2 10;
    opacity:0;
  }

  .route.show{
    opacity:1;
    animation:draw 6s ease forwards;
  }

  @keyframes draw{
    from{ stroke-dashoffset:170; }
    to{ stroke-dashoffset:0; }
  }

  /* PINS */
  .pin{
    position:absolute;
    transform:translate(-50%,-100%) scale(.85);
    opacity:0;
    transition:opacity .7s ease, transform .7s ease;
  }

  .pin.show{
    opacity:1;
    transform:translate(-50%,-100%) scale(1);
  }

  .heart{
    font-size:28px;
    color:var(--heart);
    text-shadow:var(--glow);
  }

</style>
</head>

<body>

<div class="scene">

  <!-- LEFT TEXT SIDE -->
  <div class="left">
    <div class="text" id="scene2Text">
      <div class="line">You were in the Philippines.</div>
      <div class="line">I was in Thailand.</div>
      <div class="line">And somehow…</div>
      <div class="line">We met each other in Melbourne</div>
      <button class="continue" id="continueBtn">Continue</button>
    </div>
  </div>

  <!-- RIGHT MAP SIDE -->
  <div class="right">

    <img src="sl_070722_51460_20.jpg" class="map-image" alt="World map">

    <!-- SVG overlay (scaled to full right panel) -->
    <svg class="lines" viewBox="0 0 1000 560" preserveAspectRatio="none">
      <path id="routeTH" class="route" d="M450,347 C500,380 580,420 650,470" />
      <path id="routePH" class="route" d="M550,347 C580,380 620,420 650,470" />
    </svg>

    <!-- PINS positioned relative to right half -->
    <div class="pin" id="pinTH" style="left:45%; top:62%;">
      <div class="heart">❤</div>
    </div>

    <div class="pin" id="pinPH" style="left:55%; top:62%;">
      <div class="heart">❤</div>
    </div>

    <div class="pin" id="pinAU" style="left:65%; top:84%;">
      <div class="heart">❤</div>
    </div>

  </div>
</div>

<script>
  const base = 600;

  const pinTH = document.getElementById("pinTH");
  const pinPH = document.getElementById("pinPH");
  const pinAU = document.getElementById("pinAU");

  const routeTH = document.getElementById("routeTH");
  const routePH = document.getElementById("routePH");

  const lines = Array.from(document.querySelectorAll(".line"));
  const btn = document.getElementById("continueBtn");

  // Timeline (Philippines first)
const tPH = base + 1400;
const tTH = base + 2400;
const tAU = base + 3400;
const tRoutes = base + 4400;
const tFinalLine = base + 5600;
const tBtn = base + 7000;
  

  // Pin + matching line appear together
  setTimeout(() => {
    pinPH.classList.add("show");
    lines[0].classList.add("show"); // "You were in the Philippines."
  }, tPH);

  setTimeout(() => {
    pinTH.classList.add("show");
    lines[1].classList.add("show"); // "I was in Thailand."
  }, tTH);

  setTimeout(() => {
    pinAU.classList.add("show");
    lines[2].classList.add("show"); // "And somehow…"
  }, tAU);

  // Routes animate after pins are up
  setTimeout(() => {
    routePH.classList.add("show");
    routeTH.classList.add("show");
  }, tRoutes);

  // Final line after routes begin
  setTimeout(() => {
    lines[3].classList.add("show"); // "We met each other in Melbourne"
  }, tFinalLine);

  // Button appears near the end
  setTimeout(() => {
    btn.classList.add("show");
  }, tBtn);

  btn.addEventListener("click", () => {
    window.location.href = "scene3.html";
  });
</script>


</body>
</html>
