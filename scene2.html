<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 2 — We were here</title>

  <style>
    :root{
      --bg: #07080b;
      --card: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.06);
      --mapA: rgba(255,255,255,0.12);
      --mapB: rgba(255,255,255,0.08);

      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.72);

      --heart: rgba(255, 105, 180, 0.95);
      --line: rgba(255, 190, 225, 0.75);

      --glow: 0 0 18px rgba(255, 160, 200, 0.22);
      --overlayTop: rgba(0,0,0,0.35);
      --overlayBottom: rgba(0,0,0,0.70);

      --btn-bg: rgba(255, 255, 255, 0.18);
      --btn-bg-hover: rgba(255, 255, 255, 0.28);
    }

    * { box-sizing: border-box; }

    body{
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .overlay{
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, var(--overlayTop), var(--overlayBottom));
    }

    .scene{
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .wrap{
      width: min(980px, 92vw);
      display: grid;
      grid-template-rows: 1fr auto auto;
      gap: 16px;
    }

    .map-card{
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background:
        radial-gradient(1200px 600px at 20% 30%, rgba(255,255,255,0.06), transparent 60%),
        radial-gradient(900px 500px at 80% 70%, rgba(255,105,180,0.05), transparent 55%),
        var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }

    .map-svg{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.95;
    }

    .lines{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .route{
      fill: none;
      stroke: var(--line);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 2 10;   /* dotted */
      opacity: 0;
    }

    .route.show{
      opacity: 1;
      animation: draw 2.4s ease forwards;
    }

    @keyframes draw{
      from { stroke-dashoffset: 160; }
      to   { stroke-dashoffset: 0; }
    }

    .pin{
      position: absolute;
      transform: translate(-50%, -100%) scale(0.85);
      opacity: 0;
      transition: opacity 0.7s ease, transform 0.7s ease;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.35));
      user-select: none;
      pointer-events: none;
    }

    .pin.show{
      opacity: 1;
      transform: translate(-50%, -100%) scale(1);
    }

    .pin .heart{
      font-size: clamp(22px, 3vw, 30px);
      color: var(--heart);
      text-shadow: var(--glow);
      line-height: 1;
    }

    .pin .label{
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.2px;
      text-align: center;
      white-space: nowrap;
      opacity: 0.95;
    }

    .text{
      text-align: center;
      text-shadow: var(--glow);
      padding: 0 10px 0;
    }

    .line{
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 1.0s ease, transform 1.0s ease;
      font-weight: 300;
      font-size: clamp(20px, 2.4vw, 30px);
      margin: 8px 0;
    }

    .line.show{
      opacity: 1;
      transform: translateY(0);
    }

    .continue{
      justify-self: center;
      margin-top: 6px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: var(--btn-bg);
      color: #fff;
      font-size: 14px;
      letter-spacing: 0.2px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.8s ease, transform 0.8s ease, background 0.2s ease;
    }

    .continue.show{
      opacity: 1;
      transform: translateY(0);
    }

    .continue:hover{
      background: var(--btn-bg-hover);
    }

    .tiny{
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.2px;
      margin-top: -6px;
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="scene">
    <div class="wrap">

      <div class="map-card" id="mapCard">

        <!-- Recognizable simplified world map silhouette (dark minimal) -->
        <svg class="map-svg" viewBox="0 0 1000 560" preserveAspectRatio="none" aria-hidden="true">
          <g opacity="0.9">
            <!-- North America -->
            <path d="M108 170c35-34 88-48 135-44 50 4 94 26 126 58 18 18 22 38 10 60-15 28-50 45-85 52-46 9-99 5-141-13-32-14-62-40-67-68-3-15 5-31 22-45z"
                  fill="var(--mapA)"/>
            <!-- Greenland-ish hint -->
            <path d="M250 110c20-14 52-10 66 8 10 14 2 30-14 40-18 10-48 6-60-10-10-14-4-28 8-38z"
                  fill="var(--mapB)"/>
            <!-- South America -->
            <path d="M300 320c18-10 40 2 50 20 10 18 6 40-2 58-10 22-24 42-24 68 0 18 12 36 0 48-14 14-42-3-52-22-14-26-10-58 2-86 10-24 8-58 26-86z"
                  fill="var(--mapB)"/>
            <!-- Europe -->
            <path d="M475 175c20-18 54-20 78-10 20 8 34 24 30 38-6 20-42 28-70 28-22 0-58-6-60-26-1-8 8-20 22-30z"
                  fill="var(--mapB)"/>
            <!-- Africa -->
            <path d="M500 230c26-18 68-18 94 4 24 20 28 52 18 80-10 30-28 58-22 90 4 18 14 34 2 46-16 16-50 2-66-18-22-28-30-70-20-106 10-34-10-60-6-96z"
                  fill="var(--mapA)"/>
            <!-- Asia -->
            <path d="M560 160c48-30 122-34 178-14 54 18 98 60 110 100 8 28-6 52-34 66-36 18-84 14-124 6-50-10-120-34-152-68-20-22-26-56 22-90z"
                  fill="var(--mapA)"/>
            <!-- Australia -->
            <path d="M770 365c30-18 78-14 104 10 22 20 22 52 0 70-26 22-74 22-108 2-24-14-34-44-16-64 6-8 12-12 20-18z"
                  fill="var(--mapB)"/>
          </g>

          <!-- subtle grid vibe -->
          <g opacity="0.09">
            <path d="M0 140 H1000" stroke="#fff" stroke-width="1"/>
            <path d="M0 280 H1000" stroke="#fff" stroke-width="1"/>
            <path d="M0 420 H1000" stroke="#fff" stroke-width="1"/>
            <path d="M200 0 V560" stroke="#fff" stroke-width="1"/>
            <path d="M500 0 V560" stroke="#fff" stroke-width="1"/>
            <path d="M800 0 V560" stroke="#fff" stroke-width="1"/>
          </g>
        </svg>

        <!-- Dotted routes (SVG coordinates match viewBox) -->
        <svg class="lines" viewBox="0 0 1000 560" preserveAspectRatio="none" aria-hidden="true">
          <!-- Thailand -> Melbourne -->
          <path id="routeTH" class="route" d="M720,320 C780,340 820,380 840,450" />
          <!-- Philippines -> Melbourne -->
          <path id="routePH" class="route" d="M760,300 C810,330 835,380 840,450" />
        </svg>

        <!-- Pins positioned in % (tweak later if you want more accuracy) -->
        <div class="pin" id="pinTH" style="left: 72%; top: 57%;">
          <div class="heart">❤</div>
          <div class="label">Thailand</div>
        </div>

        <div class="pin" id="pinPH" style="left: 76%; top: 54%;">
          <div class="heart">❤</div>
          <div class="label">Philippines</div>
        </div>

        <div class="pin" id="pinAU" style="left: 84%; top: 80%;">
          <div class="heart">❤</div>
          <div class="label">Australia</div>
        </div>

      </div>

      <div class="text" id="scene2Text">
        <div class="line">You were in the Philippines.</div>
        <div class="line">I was in Thailand.</div>
        <div class="line">And somehow…</div>
        <div class="line">We met each other in Melbourne</div>
      </div>

      <div class="tiny">(we were really out here)</div>

      <!-- If you want to go to Scene 3, change the filename below -->
      <button class="continue" id="continueBtn">Continue</button>

    </div>
  </div>

  <script>
    // Total feel: ~10–12s
    const base = 600;

    const pinTH = document.getElementById("pinTH");
    const pinPH = document.getElementById("pinPH");
    const pinAU = document.getElementById("pinAU");

    const routeTH = document.getElementById("routeTH");
    const routePH = document.getElementById("routePH");

    const textLines = Array.from(document.querySelectorAll("#scene2Text .line"));
    const btn = document.getElementById("continueBtn");

    // Pins
    setTimeout(() => pinTH.classList.add("show"), base + 400);
    setTimeout(() => pinPH.classList.add("show"), base + 1400);
    setTimeout(() => pinAU.classList.add("show"), base + 2400);

    // Routes
    setTimeout(() => routeTH.classList.add("show"), base + 3200);
    setTimeout(() => routePH.classList.add("show"), base + 3600);

    // Text
    const textBase = base + 4300;
    const textDelays = [0, 1600, 3200, 4800];

    textLines.forEach((el, i) => {
      setTimeout(() => el.classList.add("show"), textBase + textDelays[i]);
    });

    // Button appears near the end
    setTimeout(() => btn.classList.add("show"), textBase + 6200);

    btn.addEventListener("click", () => {
      // Change this to your next file when ready, e.g. "scene3.html"
      window.location.href = "scene3.html";
    });
  </script>
</body>
</html>
