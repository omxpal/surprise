<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Scene Website</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: black;
      color: white;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .background {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: -1;
    }
    .background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-weight: 300;
      text-align: center;
      opacity: 0;
      animation: fadeIn 2s forwards;
      animation-delay: 1s;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .continue {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: rgba(255, 255, 255, 0.3);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      opacity: 0;
      animation: fadeIn 2s forwards;
      animation-delay: 3s;
    }
  </style>
</head>
<body>
  <div class="background">
    <video autoplay loop muted playsinline>
      <source src="stars-video.mp4" type="video/mp4" />
    </video>
  </div>

  <h1>In a universe this big…</h1>
  <button class="continue">Continue</button>
</body>
</html>
