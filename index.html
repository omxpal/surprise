<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Scene Website</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: black;
            color: white;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        .background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: loop 30s infinite;
        }
        @keyframes loop {
            from { transform: translateY(0); }
            to { transform: translateY(-50%); }
        }
        h1 {
            font-weight: 300;
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s forwards;
            animation-delay: 1s;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        .continue {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.3);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0;
            animation: fadeIn 2s forwards;
            animation-delay: 3s;
        }
    </style>
</head>
<body>
    <div class="background">
        <video autoplay loop muted>
            <source src="path/to/stars-video.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>
    <h1>Welcome to Scene 1 - Space</h1>
    <button class="continue">Continue</button>
</body>
</html>
