<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Scene Website</title>

  <style>
    :root {
      --text-glow: 0 0 18px rgba(255, 255, 255, 0.25);
      --overlay-top: rgba(0, 0, 0, 0.45);
      --overlay-bottom: rgba(0, 0, 0, 0.75);
      --btn-bg: rgba(255, 255, 255, 0.22);
      --btn-bg-hover: rgba(255, 255, 255, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    /* FULLSCREEN BACKGROUND VIDEO */
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
      background: #000;
    }

    .background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* DARK GRADIENT OVERLAY */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(
        to bottom,
        var(--overlay-top),
        var(--overlay-bottom)
      );
    }

    /* CENTERED SCENE CONTENT */
    .scene {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .text {
      max-width: 720px;
      line-height: 1.35;
      text-shadow: var(--text-glow);
    }

    .line {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 1.1s ease, transform 1.1s ease;
      font-weight: 300;
      font-size: clamp(22px, 3vw, 36px);
      margin: 10px 0;
    }

    .line.show {
      opacity: 1;
      transform: translateY(0);
    }

    .continue {
      margin-top: 22px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: var(--btn-bg);
      color: #fff;
      font-size: 14px;
      letter-spacing: 0.2px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.8s ease, transform 0.8s ease, background 0.2s ease;
    }

    .continue.show {
      opacity: 1;
      transform: translateY(0);
    }

    .continue:hover {
      background: var(--btn-bg-hover);
    }
  </style>
</head>

<body>

  <!-- BACKGROUND VIDEO -->
  <div class="background">
    <video autoplay loop muted playsinline>
      <source src="857251-hd_1620_1080_25fps.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- OVERLAY FOR READABILITY -->
  <div class="overlay"></div>

  <!-- SCENE 1 -->
  <div class="scene">
    <div class="text" id="scene1Text">
      <div class="line">In a universe this big…</div>
      <div class="line">it still feels impossible that I found you.</div>
      <div class="line">Through space, through time—</div>
      <div class="line">I'm so lucky to have you</div>
      <button class="continue" id="continueBtn">Continue</button>
    </div>
  </div>

  <script>
  const lines = Array.from(document.querySelectorAll(".line"));
  const btn = document.getElementById("continueBtn");

  const baseDelay = 2000; // 3 second delay before anything starts

  const delays = [
    baseDelay + 800,
    baseDelay + 2600,
    baseDelay + 4400,
    baseDelay + 6200
  ];

  lines.forEach((line, i) => {
    setTimeout(() => {
      line.classList.add("show");
    }, delays[i]);
  });

  setTimeout(() => {
    btn.classList.add("show");
  }, baseDelay + 7800);

  btn.addEventListener("click", () => {
    alert("Scene 2 next 🙂");
  });
</script>


</body>
</html>
