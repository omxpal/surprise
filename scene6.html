<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scene 6</title>

<style>
:root{
  --bg1:#060715;
  --bg2:#120a22;
  --bg3:#2a0f2e;

  --text: rgba(255,255,255,0.92);
  --glow: 0 0 18px rgba(255,160,200,0.18);
  --pink: rgba(255,105,180,0.95);

  --card: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.10);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: var(--text);
  background:
    radial-gradient(1200px 800px at 20% 25%, rgba(255,255,255,0.06), transparent 60%),
    radial-gradient(900px 650px at 75% 70%, rgba(255,105,180,0.08), transparent 60%),
    linear-gradient(180deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:22px;
}

/* FIREWORKS CANVAS (BEHIND EVERYTHING) */
#fireworks{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

/* STAGE */
.wrap{
  width: min(900px, 94vw);
  height: min(650px, 85vh);
  position: relative;
  display: grid;
  place-items: center;
  z-index:2; /* above fireworks */
}

/* OVERLAY LAYERS */
.layer{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  pointer-events:none;
}

/* TEXT */
.message{
  font-size: clamp(34px, 4.5vw, 56px);
  font-weight:600;
  opacity:0;
  transform: translateY(8px);
  transition: opacity 1s ease, transform 1s ease;
  text-shadow: var(--glow);
}

.message.show{
  opacity:1;
  transform: translateY(0);
}

.message.fade{
  opacity:0;
  transform: translateY(-8px);
}

.message.hidden{
  display:none;
}

/* VIDEO */
.video-layer{
  display:grid;
  gap:12px;
  place-items:center;
  pointer-events:auto; /* allow video controls */
}

.video-card{
  width: min(480px, 80vw);
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--border);
  background:var(--card);
  box-shadow:0 18px 60px rgba(0,0,0,0.45);
  opacity:0;
  transform: translateY(10px) scale(0.96);
  transition: opacity 1.2s ease, transform 1.2s ease;
}

.video-card.show{
  opacity:1;
  transform: translateY(0) scale(1);
}

video{
  width:100%;
  display:block;
  background:#000;
}

.caption{
  font-size:14px;
  color:rgba(255,255,255,0.75);
  opacity:0;
  transition: opacity 1s ease;
  text-shadow: var(--glow);
}

.caption.show{
  opacity:1;
}

.caption span{
  color:var(--pink);
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="wrap">

  <div class="layer">
    <div class="message" id="msg1">Great choice !!!</div>
  </div>

  <div class="layer">
    <div class="message" id="msg2">Thank youuu</div>
  </div>

  <div class="layer video-layer">
    <div class="video-card" id="videoCard">
      <video id="vid" controls playsinline>
        <source src="pootie.MP4" type="video/mp4">
      </video>
    </div>
    <div class="caption" id="caption">same person, every lifetime</div>
  </div>

</div>

<script>
/* -------------------------
   SCENE TIMELINE
-------------------------- */
const msg1 = document.getElementById("msg1");
const msg2 = document.getElementById("msg2");
const videoCard = document.getElementById("videoCard");
const caption = document.getElementById("caption");
const vid = document.getElementById("vid");

setTimeout(() => msg1.classList.add("show"), 500);
setTimeout(() => msg1.classList.add("fade"), 2500);
setTimeout(() => msg1.classList.add("hidden"), 3600);

setTimeout(() => msg2.classList.add("show"), 3500);
setTimeout(() => msg2.classList.add("fade"), 5500);
setTimeout(() => msg2.classList.add("hidden"), 6600);

setTimeout(() => {
  videoCard.classList.add("show");
  caption.classList.add("show");
  vid.play().catch(()=>{});

  // Fireworks start when video appears
  startFireworks(11000); // run ~11s (tweak)
}, 6500);
</script>

<script>
/* -------------------------
   FIREWORKS (CANVAS) — FIXED
   - Explodes at apex (vy >= 0) OR when reaching targetY
   - Launches from SIDES (no middle)
   - Bigger, brighter bursts
-------------------------- */

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d", { alpha: true });

let W = 0, H = 0;
let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

let rockets = [];
let particles = [];

let running = false;
let stopAt = 0;

const palette = [
  [255,105,180], // hot pink
  [255,170,220], // soft pink
  [190,140,255], // lavender
  [255,255,255]  // white
];

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function rand(min, max){ return Math.random() * (max - min) + min; }
function pick(arr){ return arr[(Math.random() * arr.length) | 0]; }

function rgba(rgb, a){
  return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
}

function launchRocket(){
  // SIDE LAUNCH ZONES ONLY:
  // left 0–18% and right 82–100%
  const fromLeft = Math.random() < 0.5;
  const x = fromLeft ? rand(W * 0.04, W * 0.18) : rand(W * 0.82, W * 0.96);
  const y = H + rand(20, 110);

  // Aim the explosion toward mid-ish height but not centered horizontally
  const targetY = rand(H * 0.16, H * 0.42);

  // slight inward curve so side fireworks feel like they frame the center
  const vx = fromLeft ? rand(1.2, 2.6) : rand(-2.6, -1.2);

  rockets.push({
    x, y,
    vx,
    vy: rand(-12.5, -16.0),
    ay: 0.14,
    drag: 0.992,
    targetY,
    color: pick(palette),
    exploded: false
  });
}

function explode(x, y, base){
  // BIGGER, CLEARER BURST
  const count = (rand(90, 150)) | 0;
  for(let i=0; i<count; i++){
    const a = rand(0, Math.PI * 2);
    const sp = rand(2.2, 7.0);
    const col = (Math.random() < 0.25) ? [255,255,255] : base;

    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      ay: 0.07,
      drag: 0.985,
      life: rand(65, 120),
      size: rand(1.3, 2.8),
      color: col,
      twinkle: Math.random() < 0.30
    });
  }

  // A small second “pop” ring makes it look like a real explosion
  const ringCount = (rand(22, 34)) | 0;
  for(let i=0; i<ringCount; i++){
    const a = (i / ringCount) * Math.PI * 2;
    const sp = rand(4.2, 6.2);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      ay: 0.05,
      drag: 0.988,
      life: rand(45, 75),
      size: rand(1.8, 3.2),
      color: [255,170,220],
      twinkle: false
    });
  }
}

function draw(){
  if(!running) return;

  // Trail fade (DON'T clear fully; fade with alpha)
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.fillRect(0, 0, W, H);

  // Spawn rockets (gentle)
  if (performance.now() < stopAt) {
    if (Math.random() < 0.10) launchRocket(); // more frequent so you SEE explosions
  }

  // Rockets
  for(let i=rockets.length-1; i>=0; i--){
    const r = rockets[i];

    r.vx *= r.drag;
    r.vy *= r.drag;
    r.vy += r.ay;

    r.x += r.vx;
    r.y += r.vy;

    // draw rocket + trail
    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    // trail
    ctx.strokeStyle = rgba(r.color, 0.55);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(r.x, r.y);
    ctx.lineTo(r.x - r.vx * 6, r.y - r.vy * 6);
    ctx.stroke();

    // head glow
    ctx.fillStyle = rgba(r.color, 0.95);
    ctx.beginPath();
    ctx.arc(r.x, r.y, 2.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // EXPLODE CONDITION:
    // explode when rocket starts falling (vy >= 0) OR it reaches targetY
    if(!r.exploded && (r.vy >= 0 || r.y <= r.targetY)){
      r.exploded = true;
      explode(r.x, r.y, r.color);
      rockets.splice(i, 1);
      continue;
    }

    // off-screen cleanup
    if(r.y > H + 200 || r.x < -200 || r.x > W + 200){
      rockets.splice(i, 1);
    }
  }

  // Particles
  for(let i=particles.length-1; i>=0; i--){
    const p = particles[i];

    p.vx *= p.drag;
    p.vy *= p.drag;
    p.vy += p.ay;

    p.x += p.vx;
    p.y += p.vy;

    p.life -= 1;

    const fade = Math.max(0, Math.min(1, p.life / 120));
    let alpha = 0.95 * fade;
    if(p.twinkle && Math.random() < 0.22) alpha *= 0.25;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = rgba(p.color, alpha);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if(p.life <= 0 || p.y > H + 120 || p.x < -120 || p.x > W + 120){
      particles.splice(i, 1);
    }
  }

  // Stop when time’s up and everything is gone
  if (performance.now() >= stopAt && rockets.length === 0 && particles.length === 0) {
    running = false;
    // fade out remaining trails quickly
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, W, H);
    return;
  }

  requestAnimationFrame(draw);
}

function startFireworks(durationMs = 9000){
  stopAt = performance.now() + durationMs;
  if(!running){
    running = true;
    // start with a couple of immediate side bursts so you instantly see it
    setTimeout(() => explode(rand(W*0.06, W*0.18), rand(H*0.22, H*0.40), pick(palette)), 80);
    setTimeout(() => explode(rand(W*0.82, W*0.94), rand(H*0.22, H*0.40), pick(palette)), 220);
    draw();
  }
}
</script>

</body>
</html>
