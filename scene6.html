<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scene 6</title>

<style>
:root{
  --bg1:#060715;
  --bg2:#120a22;
  --bg3:#2a0f2e;

  --text: rgba(255,255,255,0.92);
  --glow: 0 0 18px rgba(255,160,200,0.18);
  --pink: rgba(255,105,180,0.95);

  --card: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.10);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: var(--text);
  background:
    radial-gradient(1200px 800px at 20% 25%, rgba(255,255,255,0.06), transparent 60%),
    radial-gradient(900px 650px at 75% 70%, rgba(255,105,180,0.08), transparent 60%),
    linear-gradient(180deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:22px;
}

.wrap{
  width: min(900px, 94vw);
  display:grid;
  justify-items:center;
  gap:16px;
}

/* TEXT */
.message{
  font-size: clamp(34px, 4.5vw, 56px);
  font-weight:600;
  opacity:0;
  transform: translateY(8px);
  transition: opacity 1s ease, transform 1s ease;
  text-shadow: var(--glow);
}

.message.show{
  opacity:1;
  transform: translateY(0);
}

.message.fade{
  opacity:0;
  transform: translateY(-8px);
}

/* VIDEO */
.video-card{
  width: min(480px, 80vw); /* smaller than before */
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--border);
  background:var(--card);
  box-shadow:0 18px 60px rgba(0,0,0,0.45);
  opacity:0;
  transform: translateY(10px) scale(0.96);
  transition: opacity 1.2s ease, transform 1.2s ease;
}

.video-card.show{
  opacity:1;
  transform: translateY(0) scale(1);
}

video{
  width:100%;
  display:block;
  background:#000;
}

.caption{
  font-size:14px;
  color:rgba(255,255,255,0.75);
  margin-top:8px;
  opacity:0;
  transition: opacity 1s ease;
  text-shadow: var(--glow);
}

.caption.show{
  opacity:1;
}

.caption span{
  color:var(--pink);
}
</style>
</head>

<body>

<div class="wrap">

  <div class="message" id="msg1">Great choice !!!</div>
  <div class="message" id="msg2">Thank youuu</div>

  <div class="video-card" id="videoCard">
    <video id="vid" controls playsinline>
      <source src="pootie.MP4" type="video/mp4">
    </video>
  </div>

  <div class="caption" id="caption">same person, every lifetime</div>

</div>

<script>
const msg1 = document.getElementById("msg1");
const msg2 = document.getElementById("msg2");
const videoCard = document.getElementById("videoCard");
const caption = document.getElementById("caption");
const vid = document.getElementById("vid");

// Timeline
// 0.5s → Great choice appears
// 2.5s → fade out
// 3.5s → Thank youuu appears
// 5.5s → fade out
// 6.5s → video + caption appear

setTimeout(() => msg1.classList.add("show"), 500);

setTimeout(() => msg1.classList.add("fade"), 2500);

setTimeout(() => msg2.classList.add("show"), 3500);

setTimeout(() => msg2.classList.add("fade"), 5500);

setTimeout(() => {
  videoCard.classList.add("show");
  caption.classList.add("show");
  vid.play().catch(()=>{});
}, 6500);
</script>

</body>
</html>
