<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 6 — Good choice</title>

  <style>
    :root{
      --bg1:#060715;
      --bg2:#120a22;
      --bg3:#2a0f2e;

      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);

      --glow: 0 0 18px rgba(255,160,200,0.18);
      --pink: rgba(255,105,180,0.95);

      --card: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.10);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      height:100vh;
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 20% 25%, rgba(255,255,255,0.06), transparent 60%),
        radial-gradient(900px 650px at 75% 70%, rgba(255,105,180,0.08), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px;
      text-align:center;
    }

    .vignette{
      position: fixed;
      inset: 0;
      pointer-events:none;
      background: radial-gradient(closest-side, transparent 55%, rgba(0,0,0,0.55));
    }

    .wrap{
      width: min(900px, 94vw);
      display: grid;
      justify-items: center;
      gap: 14px;
      text-shadow: var(--glow);
    }

    /* Text intro */
    .intro{
      font-weight: 600;
      font-size: clamp(34px, 4.4vw, 54px);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1.0s ease, transform 1.0s ease;
    }

    .intro.show{
      opacity: 1;
      transform: translateY(0);
    }

    .intro.fadeout{
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    /* Video card */
    .video-card{
      width: min(680px, 92vw);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      transform: translateY(10px) scale(0.98);
      transition: opacity 1.1s ease, transform 1.1s ease;
    }

    .video-card.show{
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    video{
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }

    .caption{
      margin-top: 10px;
      font-size: 14px;
      letter-spacing: 0.2px;
      color: rgba(255,255,255,0.78);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 1.0s ease, transform 1.0s ease;
      text-shadow: var(--glow);
    }

    .caption.show{
      opacity: 1;
      transform: translateY(0);
    }

    .caption .pink{
      color: var(--pink);
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="vignette"></div>

  <div class="wrap">
    <div class="intro" id="intro">good choice</div>

    <div class="video-card" id="videoCard">
      <video id="vid" controls playsinline preload="metadata">
        <source src="pootie.MP4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>

    <div class="caption" id="caption">same person, every lifetime</div>
  </div>

  <script>
    const intro = document.getElementById("intro");
    const videoCard = document.getElementById("videoCard");
    const caption = document.getElementById("caption");
    const vid = document.getElementById("vid");

    // Sequence:
    // 1) show "good choice"
    // 2) fade it out
    // 3) reveal video + caption
    const t0 = 400;
    const tFadeOut = 2000;     // when intro starts fading
    const tReveal = 3000;      // when video appears
    const tCaption = 3600;

    setTimeout(() => intro.classList.add("show"), t0);

    setTimeout(() => {
      intro.classList.add("fadeout");
    }, tFadeOut);

    setTimeout(() => {
      videoCard.classList.add("show");
      caption.classList.add("show");

      // Try to autoplay (may be blocked unless muted).
      // If you want guaranteed autoplay, add `muted` to the <video> tag.
      vid.play().catch(() => {});
    }, tReveal);

    // If you want caption slightly later, uncomment:
    // setTimeout(() => caption.classList.add("show"), tCaption);
  </script>
</body>
</html>
